pre-commit:
  commands:
    rubocop:
      glob: "*.{rb,gemfile}"
      run: bundle exec rubocop --force-exclusion {staged_files}
    eslint-frontend:
      root: frontend/
      glob: "*.{ts,vue}"
      run: npx eslint --fix {staged_files}
    eslint-demo-rp:
      root: demo-rp/
      glob: "*.{ts,vue}"
      run: npx eslint --fix {staged_files}

pre-push:
  commands:
    rspec-auth:
      root: idp-auth/
      run: bundle exec rspec
    rspec-user:
      root: idp-user/
      run: bundle exec rspec
    rspec-client:
      root: idp-client/
      run: bundle exec rspec
