services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infrastructure/postgresql/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - sso_network

  idp-auth:
    build: ./idp-auth
    command: bundle exec rails server -b 0.0.0.0 -p 3000
    volumes:
      - ./idp-auth:/app
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    networks:
      - sso_network

  idp-user:
    build: ./idp-user
    command: bundle exec rails server -b 0.0.0.0 -p 3001
    volumes:
      - ./idp-user:/app
    ports:
      - "3001:3001"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/user_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    networks:
      - sso_network

  idp-client:
    build: ./idp-client
    command: bundle exec rails server -b 0.0.0.0 -p 3002
    volumes:
      - ./idp-client:/app
    ports:
      - "3002:3002"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/client_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    networks:
      - sso_network

  frontend:
    build: ./frontend
    command: pnpm dev
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    networks:
      - sso_network

  demo-rp:
    build: ./demo-rp
    command: pnpm dev
    volumes:
      - ./demo-rp:/app
    ports:
      - "5174:5174"
    networks:
      - sso_network

volumes:
  pg_data:

networks:
  sso_network:
    driver: bridge
