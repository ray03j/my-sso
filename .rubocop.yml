inherit_from: .rubocop_enabled_cops.yml

AllCops:
  TargetRubyVersion: 3.3
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - '*/db/schema.rb'
    - '*/vendor/**/*'
    - '*/tmp/**/*'
    - '*/bin/**/*'

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - '*/spec/**/*'
    - '*/config/routes.rb'

Metrics/ParameterLists:
  CountKeywordArgs: false
